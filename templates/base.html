<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="d-flex">
    <nav class="sidebar border-end p-3">
        <h4 class="mb-4">Expense Tracker</h4>
        <ul class="nav nav-pills flex-column gap-1 mb-4">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'dashboard' else '' }}" href="{{ url_for('dashboard.index') }}">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'transactions' else '' }}" href="{{ url_for('transactions.index') }}">Transactions</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'graphs' else '' }}" href="{{ url_for('graphs.index') }}">Graphs</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'income' else '' }}" href="{{ url_for('income.index') }}">Income</a>
            </li>
        </ul>
        <button type="button" id="theme-toggle" class="btn btn-outline-secondary w-100" aria-label="Toggle dark mode">🌙 Theme</button>
    </nav>
    <main class="flex-grow-1 p-4">
        {% block content %}{% endblock %}
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
<script src="{{ url_for('static', filename='js/base.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
