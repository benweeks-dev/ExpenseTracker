<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script>
        // Set theme + sidebar state before page renders to prevent flash
        document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");
        if (localStorage.getItem("sidebarCollapsed") === "true") {
            document.documentElement.classList.add("sidebar-collapsed");
        }
    </script>
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="topbar sticky-top bg-body d-flex align-items-center gap-2 border-bottom p-2">
    <button type="button" id="sidebar-toggle" class="btn btn-outline-secondary" aria-label="Toggle sidebar">☰</button>
    <span class="d-flex align-items-center gap-2 fw-bold fs-5">💵 Expense Tracker</span>
</div>
<div class="d-flex">
    <nav class="sidebar offcanvas-lg offcanvas-start border-end p-3 text-nowrap text-truncate" tabindex="-1" id="sidebar" aria-label="Sidebar navigation">
        <div class="d-lg-none d-flex justify-content-between align-items-center mb-4">
            <span class="d-flex align-items-center gap-2 fw-bold fs-5">💵 Expense Tracker</span>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
        </div>
        <ul class="nav nav-pills flex-column gap-1 mb-4 mt-2">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'dashboard' else '' }}" href="{{ url_for('dashboard.index') }}">
                    <span class="nav-icon">📊</span><span class="sidebar-label">Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'transactions' else '' }}" href="{{ url_for('transactions.index') }}">
                    <span class="nav-icon">💳</span><span class="sidebar-label">Transactions</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'graphs' else '' }}" href="{{ url_for('graphs.index') }}">
                    <span class="nav-icon">📈</span><span class="sidebar-label">Graphs</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if request.blueprint == 'income' else '' }}" href="{{ url_for('income.index') }}">
                    <span class="nav-icon">💰</span><span class="sidebar-label">Income</span>
                </a>
            </li>
        </ul>
        <button type="button" id="theme-toggle" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-left gap-2" aria-label="Toggle dark mode">
            <span class="nav-icon" id="theme-icon"></span><span class="sidebar-label">Theme</span>
        </button>
    </nav>
    <main class="content flex-grow-1 p-4">
        {% block content %}{% endblock %}
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
<script src="{{ url_for('static', filename='js/base.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
