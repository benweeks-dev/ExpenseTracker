<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 720px;">
    <h1 class="mb-4">Expense Tracker</h1>

    <div class="alert alert-primary fs-4">
        Total: ${{ "%.2f"|format(total) }}
    </div>

    <form method="POST" action="{{ url_for('add_expense') }}" class="row g-2 mb-4">
        <div class="col-sm-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
        </div>
        <div class="col-sm-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" required>
        </div>
        <div class="col-sm-4">
            <label class="form-label">Description (optional)</label>
            <input type="text" name="description" class="form-control">
        </div>
        <div class="col-sm-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th class="text-end">Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for e in expenses %}
            <tr>
                <td>{{ e.date_added.strftime('%Y-%m-%d %H:%M') }}</td>
                <td>{{ e.category }}</td>
                <td>{{ e.description or "" }}</td>
                <td class="text-end">${{ "%.2f"|format(e.amount) }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center text-muted">No expenses yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
